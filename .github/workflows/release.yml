name: Build and publish GCL release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.7.2
      source_ref:
        description: Source commit or branch
        required: true
        default: main

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  SOURCE_REF: ${{ inputs.source_ref || github.event.release.tag_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build Windows package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          New-Item -ItemType Directory -Force .gcl-build | Out-Null
          git clone --branch v0.59.0 --depth 1 https://github.com/fatedier/frp.git .gcl-build/frp
          if ($LASTEXITCODE -ne 0) { throw "frp source checkout failed" }
          Push-Location .gcl-build/frp
          go build -trimpath -ldflags="-s -w" -o ../frpc.exe ./cmd/frpc
          if ($LASTEXITCODE -ne 0) { throw "frpc build failed" }
          Pop-Location
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          python -m PyInstaller --noconfirm --windowed --onedir --name "Glow Craft Launcher" --icon icon.ico --add-data "ui.html;." --add-data "ui.js;." --add-data "skinview3d.min.js;." --add-data "lucide.min.js;." --add-data "THIRD_PARTY.md;." --add-data "icon.png;." --add-data "update-channel.json;." --add-data "update-install.ps1;." --add-data "licenses;licenses" --add-binary ".gcl-build\frpc.exe;." --collect-all PySide6 --collect-all minecraft_launcher_lib --collect-all keyring app_web.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
          $version = python -c "import launcher_updater; print(launcher_updater.APP_VERSION)"
          Set-Content -Path "dist/Glow Craft Launcher/version.txt" -Value $version -Encoding ascii
          Compress-Archive -Path "dist/Glow Craft Launcher/*" -DestinationPath "Glow-Craft-Launcher-Windows-x64-v$version.zip"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Move-Item "Glow-Craft-Launcher-Windows-x64-v$version.zip" release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: release-assets/*

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build macOS package
        run: |
          python3 -m pip install --user -r requirements.txt pyinstaller
          GCL_PYTHON="$(python3 -c 'import sys; print(sys.executable)')" sh build-macos.sh
          VERSION="$(python3 -c 'import launcher_updater; print(launcher_updater.APP_VERSION)')"
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then PLATFORM=arm64; else PLATFORM=x86_64; fi
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "dist/Glow Craft Launcher.app" "release-assets/Glow-Craft-Launcher-macOS-$PLATFORM-v$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release-assets/*

  publish-assets:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-package"
          merge-multiple: true

      - name: Create shared update manifest
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          git archive --format=zip -o "release-assets/Glow-Craft-Launcher-source-$RELEASE_TAG.zip" HEAD
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          repo = os.environ["GH_REPOSITORY"]
          root = Path("release-assets")
          files = {
              "windows-x86_64": next(root.glob("Glow-Craft-Launcher-Windows-x64-v*.zip")),
          }
          mac_package = next(root.glob("Glow-Craft-Launcher-macOS-*-v*.zip"))
          mac_platform = "macos-arm64" if "-arm64-" in mac_package.name else "macos-x86_64"
          files[mac_platform] = mac_package
          manifest = {"schema": 1, "version": version, "notes": f"Glow Craft Launcher {version}", "platforms": {}}
          for platform, path in files.items():
              manifest["platforms"][platform] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{path.name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }
          (root / "update.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Attach both platform packages and update manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/Glow-Craft-Launcher-macOS-*-v*.zip
            release-assets/Glow-Craft-Launcher-Windows-x64-v*.zip
            release-assets/update.json
            release-assets/Glow-Craft-Launcher-source-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
