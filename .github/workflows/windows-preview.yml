name: Windows preview build

on:
  push:
    branches:
      - windows-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out workflow
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download v0.6.0 source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Na1onp/Glow-Craft-Launcher/releases/download/v0.6.0/Glow-Craft-Launcher-source-v0.6.0.zip" -OutFile source.zip
          New-Item -ItemType Directory -Force source | Out-Null
          Expand-Archive -Path source.zip -DestinationPath source

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt pyinstaller pillow

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          Set-Location source
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build Windows application
        shell: pwsh
        run: |
          Set-Location source
          python -m PyInstaller --noconfirm --windowed --onedir --name "Glow Craft Launcher" --icon icon.ico --add-data "ui.html;." --add-data "ui.js;." --add-data "skinview3d.min.js;." --add-data "lucide.min.js;." --add-data "THIRD_PARTY.md;." --add-data "icon.png;." --add-data "update-channel.json;." --add-data "licenses;licenses" --collect-all PySide6 --collect-all minecraft_launcher_lib --collect-all keyring app_web.py

      - name: Create shareable Windows archive
        shell: pwsh
        run: |
          Set-Location source
          $version = python -c "import launcher_updater; print(launcher_updater.APP_VERSION)"
          @(
            "Glow Craft Launcher Windows preview v$version",
            "",
            "Unzip the entire folder, then run Glow Craft Launcher.exe.",
            "Keep the _internal folder beside the executable.",
            "This preview is unsigned and may show a Windows publisher warning.",
            "Microsoft account login requires the launcher's approved Microsoft Client ID."
          ) | Set-Content -Encoding UTF8 "dist/Glow Craft Launcher/README-Windows.txt"
          Compress-Archive -Path "dist/Glow Craft Launcher/*" -DestinationPath "Glow-Craft-Launcher-Windows-x64-v$version.zip"
          Get-FileHash "Glow-Craft-Launcher-Windows-x64-v$version.zip" -Algorithm SHA256 | Format-List

      - name: Upload Windows preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glow-Craft-Launcher-Windows-x64-preview
          path: source/Glow-Craft-Launcher-Windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 30
